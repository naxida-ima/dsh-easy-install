name: build-setup

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish DshSwitch (WinUI 3, VS MSBuild)
        run: |
          $msb = @(
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe",
            "C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\MSBuild.exe",
            "C:\Program Files\Microsoft Visual Studio\2022\Professional\MSBuild\Current\Bin\MSBuild.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $msb) { throw "VS MSBuild not found" }
          Write-Host "Using MSBuild: $msb"
          & $msb winui\DshSwitch\DshSwitch.csproj -t:Publish -p:Configuration=Release `
            -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:SelfContained=true `
            -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true `
            -p:PublishDir="$env:GITHUB_WORKSPACE\out\switch\" -v:m 2>&1 | Tee-Object -FilePath switch-build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content switch-build.log -Tail 60
            Get-Content switch-build.log -Tail 40 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            throw "DshSwitch publish failed with exit code $LASTEXITCODE"
          }
        shell: pwsh

      - name: Commit switch build log (on failure)
        if: failure()
        run: |
          git config user.email "ci@naxida.local"
          git config user.name "CI Build"
          git add -f switch-build.log
          git commit -m "ci: switch build log (run ${{ github.run_id }})" || true
          git push origin main || true
        shell: pwsh

      - name: Publish DshInstaller (WinUI 3, VS MSBuild)
        run: |
          $msb = @(
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe",
            "C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\MSBuild.exe",
            "C:\Program Files\Microsoft Visual Studio\2022\Professional\MSBuild\Current\Bin\MSBuild.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $msb) { throw "VS MSBuild not found" }
          Write-Host "Using MSBuild: $msb"
          & $msb winui\DshInstaller\DshInstaller.csproj -t:Publish -p:Configuration=Release `
            -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:SelfContained=true `
            -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true `
            -p:PublishDir="$env:GITHUB_WORKSPACE\out\install\" -v:m 2>&1 | Tee-Object -FilePath install-build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content install-build.log -Tail 60
            Get-Content install-build.log -Tail 40 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            throw "DshInstaller publish failed with exit code $LASTEXITCODE"
          }
        shell: pwsh

      - name: Commit installer build log (on failure)
        if: failure()
        run: |
          git config user.email "ci@naxida.local"
          git config user.name "CI Build"
          git add -f install-build.log
          git commit -m "ci: install build log (run ${{ github.run_id }})" || true
          git push origin main || true
        shell: pwsh

      - name: Commit XAML compiler io (on failure)
        if: failure()
        run: |
          git config user.email "ci@naxida.local"
          git config user.name "CI Build"
          git add -f winui/DshSwitch/obj/Release/net8.0-windows10.0.19041.0/win-x64/output.json
          git commit -m "ci: xaml io (run ${{ github.run_id }})" || true
          git push origin main || true
        shell: pwsh

      - name: Prepare offline bundles (node + dsh + checksums)
        run: |
          python scripts/prepare_bundles.py
        shell: pwsh

      - name: Assemble portable package
        run: |
          $pkg = 'build\package\DeepSeek-Harness-Installer'
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item -Recurse -Force 'out\install\*' $pkg
          Copy-Item -Recurse -Force 'out\switch' (Join-Path $pkg 'switch')
          Copy-Item -Recurse -Force '_assets' (Join-Path $pkg '_assets')
          Copy-Item -Force (Join-Path $pkg 'DeepSeekHarness-Installer.exe') (Join-Path $pkg '安装DeepSeekHarness.exe')
          Remove-Item -Force (Join-Path $pkg 'DeepSeekHarness-Installer.exe')
          Get-ChildItem $pkg | Select-Object Name
          Get-ChildItem (Join-Path $pkg '_assets') | Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,1)}}
        shell: pwsh

      - name: Package zip
        run: |
          python scripts/make_zip.py "build\package" "DeepSeek-Harness-Installer-v2.0.0.zip" 2>&1 | Tee-Object -FilePath pkg-build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content pkg-build.log -Tail 60
            throw "zip packaging failed with exit code $LASTEXITCODE"
          }
        shell: pwsh

      - name: Verify outputs
        run: |
          Get-ChildItem DeepSeek-Harness-Installer-v2.0.0.zip | Select-Object Name, Length
          if (-not (Test-Path DeepSeek-Harness-Installer-v2.0.0.zip)) { throw "zip not built" }
        shell: pwsh

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Installer
          path: DeepSeek-Harness-Installer-v2.0.0.zip
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release (download link for everyone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0.0 "DeepSeek-Harness-Installer-v2.0.0.zip" `
            --repo ${{ github.repository }} `
            --title "DeepSeek Harness 一键安装包 v2.0.0（WinUI 3 界面）" `
            --notes "解压后双击「安装DeepSeekHarness.exe」即可，全部依赖已内置，无需联网。`nWinUI 3 Fluent 界面，含环境检测、可选组件、一键安装、桌面开关。" `
          | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "release exists, uploading with clobber..."
            gh release upload v2.0.0 "DeepSeek-Harness-Installer-v2.0.0.zip" --clobber `
              --repo ${{ github.repository }}
          }
          Write-Host "Release ready: https://github.com/${{ github.repository }}/releases/tag/v2.0.0"
        shell: pwsh
