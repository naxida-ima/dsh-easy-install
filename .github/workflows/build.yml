name: build-setup

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish DshSwitch (WinUI 3)
        run: |
          dotnet publish winui/DshSwitch/DshSwitch.csproj -c Release -o out/switch 2>&1 | Tee-Object -FilePath switch-build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content switch-build.log -Tail 60
            throw "DshSwitch publish failed with exit code $LASTEXITCODE"
          }
        shell: pwsh

      - name: Upload switch build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: switch-build-log
          path: switch-build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish DshInstaller (WinUI 3)
        run: |
          dotnet publish winui/DshInstaller/DshInstaller.csproj -c Release -o out/install 2>&1 | Tee-Object -FilePath install-build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content install-build.log -Tail 60
            throw "DshInstaller publish failed with exit code $LASTEXITCODE"
          }
        shell: pwsh

      - name: Upload installer build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-build-log
          path: install-build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Prepare offline bundles (node + dsh + checksums)
        run: |
          python scripts/prepare_bundles.py
        shell: pwsh

      - name: Assemble portable package
        run: |
          $pkg = 'build\package\DeepSeek-Harness-Installer'
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item -Recurse -Force 'out\install\*' $pkg
          Copy-Item -Recurse -Force 'out\switch' (Join-Path $pkg 'switch')
          Copy-Item -Recurse -Force '_assets' (Join-Path $pkg '_assets')
          Copy-Item -Force (Join-Path $pkg 'DeepSeekHarness-Installer.exe') (Join-Path $pkg '安装DeepSeekHarness.exe')
          Remove-Item -Force (Join-Path $pkg 'DeepSeekHarness-Installer.exe')
          Get-ChildItem $pkg | Select-Object Name
          Get-ChildItem (Join-Path $pkg '_assets') | Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,1)}}
        shell: pwsh

      - name: Package zip
        run: |
          python scripts/make_zip.py "build\package" "DeepSeek-Harness-Installer-v2.0.0.zip" 2>&1 | Tee-Object -FilePath pkg-build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content pkg-build.log -Tail 60
            throw "zip packaging failed with exit code $LASTEXITCODE"
          }
        shell: pwsh

      - name: Verify outputs
        run: |
          Get-ChildItem DeepSeek-Harness-Installer-v2.0.0.zip | Select-Object Name, Length
          if (-not (Test-Path DeepSeek-Harness-Installer-v2.0.0.zip)) { throw "zip not built" }
        shell: pwsh

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Installer
          path: DeepSeek-Harness-Installer-v2.0.0.zip
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release (download link for everyone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0.0 "DeepSeek-Harness-Installer-v2.0.0.zip" `
            --repo ${{ github.repository }} `
            --title "DeepSeek Harness 一键安装包 v2.0.0（WinUI 3 界面）" `
            --notes "解压后双击「安装DeepSeekHarness.exe」即可，全部依赖已内置，无需联网。`nWinUI 3 Fluent 界面，含环境检测、可选组件、一键安装、桌面开关。" `
          | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "release exists, uploading with clobber..."
            gh release upload v2.0.0 "DeepSeek-Harness-Installer-v2.0.0.zip" --clobber `
              --repo ${{ github.repository }}
          }
          Write-Host "Release ready: https://github.com/${{ github.repository }}/releases/tag/v2.0.0"
        shell: pwsh
