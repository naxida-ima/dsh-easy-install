name: build-setup

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish DshSwitch (WPF)
        run: |
          dotnet publish wpf/DshSwitch/DshSwitch.csproj -c Release -r win-x64 --self-contained true -o out/switch 2>&1 | Tee-Object -FilePath switch-build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content switch-build.log -Tail 60
            throw "DshSwitch publish failed"
          }
        shell: pwsh

      - name: Publish DshInstaller (WPF)
        run: |
          dotnet publish wpf/DshInstaller/DshInstaller.csproj -c Release -r win-x64 --self-contained true -o out/install 2>&1 | Tee-Object -FilePath install-build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content install-build.log -Tail 60
            throw "DshInstaller publish failed"
          }
        shell: pwsh

      - name: Prepare offline bundles (node + dsh + checksums)
        run: |
          python scripts/prepare_bundles.py
        shell: pwsh

      - name: Assemble portable package
        run: |
          $pkg = 'build\package\DeepSeek-Harness-Installer'
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item -Recurse -Force 'out\install\*' $pkg
          Copy-Item -Recurse -Force 'out\switch' (Join-Path $pkg 'switch')
          Copy-Item -Recurse -Force '_assets' (Join-Path $pkg '_assets')
          Copy-Item -Force (Join-Path $pkg 'DeepSeekHarness-Installer.exe') (Join-Path $pkg '安装DeepSeekHarness.exe')
          Remove-Item -Force (Join-Path $pkg 'DeepSeekHarness-Installer.exe')
          Get-ChildItem $pkg | Select-Object Name
          Get-ChildItem (Join-Path $pkg '_assets') | Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,1)}}
        shell: pwsh

      - name: Smoke test installer (full flow on Windows)
        run: |
          $pkg = 'build\package\DeepSeek-Harness-Installer'
          $exe = Join-Path $pkg '安装DeepSeekHarness.exe'
          $out = 'smoke-out.txt'
          "== smoke test start ==" | Out-File $out
          "exe: $exe" | Out-File $out -Append
          "exe exists: $(Test-Path $exe)" | Out-File $out -Append
          if (-not (Test-Path $exe)) { Get-Content $out; throw "installer exe missing" }
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru
          "installer exit code: $($p.ExitCode)" | Out-File $out -Append
          $sig = Get-AuthenticodeSignature $exe
          "signature: $($sig.Status)" | Out-File $out -Append
          try { $md = Get-MpThreatDetection | Select-Object -First 2; "mp threats: $($md.Count)" | Out-File $out -Append } catch { "mp query fail" | Out-File $out -Append }
          $sl = Join-Path $env:LOCALAPPDATA 'DeepSeekHarness\logs\selftest.log'
          "selftest.log exists: $(Test-Path $sl)" | Out-File $out -Append
          if (Test-Path $sl) { Get-Content $sl | Out-File $out -Append }
          Get-Content $out
          if ($p.ExitCode -ne 0) { throw "INSTALLER SELFTEST FAILED (exit $($p.ExitCode))" }
        shell: pwsh

      - name: Upload smoke output via API (always)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($f in @('smoke-out.txt', 'smoke-out-switch.txt')) {
            if (Test-Path $f) {
              $content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes((Get-Content $f -Raw)))
              $body = @{ message = "ci: smoke output (run ${{ github.run_id }})"; content = $content } | ConvertTo-Json
              Invoke-RestMethod -Method Put -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/smoke-${{ github.run_id }}-$($f.Replace('smoke-out-','').Replace('.txt','')).txt" `
                -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "ci" } -Body $body | Out-Null
              Write-Host "$f uploaded"
            }
          }
        shell: pwsh

      - name: Smoke test switch (service start/stop)
        run: |
          $pkg = 'build\package\DeepSeek-Harness-Installer'
          $sw = Join-Path $pkg 'switch\switch.exe'
          $out2 = 'smoke-out-switch.txt'
          "== switch smoke ==" | Out-File $out2
          "switch exe exists: $(Test-Path $sw)" | Out-File $out2 -Append
          if (-not (Test-Path $sw)) { Get-Content $out2; throw "switch exe missing" }
          $sp = Start-Process -FilePath $sw -ArgumentList '--selftest' -Wait -PassThru
          "switch exit code: $($sp.ExitCode)" | Out-File $out2 -Append
          $log = Join-Path $env:LOCALAPPDATA 'DeepSeekHarness\logs\switch-selftest.log'
          if (Test-Path $log) { Get-Content $log | Out-File $out2 -Append }
          Get-Content $out2
          if ($sp.ExitCode -ne 0) { throw "SWITCH SELFTEST FAILED (exit $($sp.ExitCode))" }
          Write-Host "==> switch selftest PASS"
        shell: pwsh

      - name: Package zip
        run: |
          python scripts/make_zip.py "build\package" "DeepSeek-Harness-Installer-v2.0.2.zip" 2>&1 | Tee-Object -FilePath pkg-build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content pkg-build.log -Tail 60
            throw "zip packaging failed with exit code $LASTEXITCODE"
          }
        shell: pwsh

      - name: Verify outputs
        run: |
          Get-ChildItem DeepSeek-Harness-Installer-v2.0.2.zip | Select-Object Name, Length
          if (-not (Test-Path DeepSeek-Harness-Installer-v2.0.2.zip)) { throw "zip not built" }
        shell: pwsh

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Installer
          path: DeepSeek-Harness-Installer-v2.0.2.zip
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release (download link for everyone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0.2 "DeepSeek-Harness-Installer-v2.0.2.zip" `
            --repo ${{ github.repository }} `
            --title "DeepSeek Harness 一键安装包 v2.0.2" `
            --notes "WPF Fluent 界面 · 已在 Windows CI 完整验证：校验→安装→启动服务→检查端口→停止 全部通过。`n解压后双击「安装DeepSeekHarness.exe」即可，全部依赖已内置，无需联网。" `
          | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "release exists, uploading with clobber..."
            gh release upload v2.0.2 "DeepSeek-Harness-Installer-v2.0.2.zip" --clobber `
              --repo ${{ github.repository }}
          }
          Write-Host "Release ready: https://github.com/${{ github.repository }}/releases/tag/v2.0.2"
        shell: pwsh
